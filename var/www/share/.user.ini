; The share uploads in chunks, so these only need to cover one chunk (32MB)
; plus overhead - not the whole file. Total upload size is unbounded and is
; limited by disk, not by these. A single 30GB POST is not possible: hiawatha
; buffers request bodies, and its PUT path is capped at 2047MB.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 0
max_input_time = 600
