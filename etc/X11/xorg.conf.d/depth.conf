# This xorg configuration file will start a dummy X11 server.
# move it to /etc/X11/xorg.conf
# don't forget apt install xserver-xorg-video-dummy;
# based on https://xpra.org/Xdummy.html

Section "ServerFlags"
  Option "DontVTSwitch" "true"
  Option "AllowMouseOpenFail" "true"
  Option "PciForceNone" "true"
  Option "AutoEnableDevices" "false"
  Option "AutoAddDevices" "false"
EndSection

Section "InputDevice"
  Identifier "dummy_mouse"
  Option "CorePointer" "true"
  Driver "void"
EndSection

Section "InputDevice"
  Identifier "dummy_keyboard"
  Option "CoreKeyboard" "true"
  Driver "void"
EndSection

Section "Device"
  Identifier "dummy_videocard"
  Driver "dummy"
  Option "ConstantDPI" "true"
  VideoRam 192000
EndSection

Section "Monitor"
  Identifier "dummy_monitor"
  HorizSync   5.0 - 1000.0
  VertRefresh 5.0 - 200.0
  Modeline "1920x1080_10.00" 21.39 1920 1784 1944 1968 1080 1081 1084 1087 -HSync -Vsync
  Modeline "1920x1080_20.00" 50.02 1920 1920 2104 2288 1080 1081 1084 1093 -HSync -Vsync
  # CVT 1600x900 timings with the pixel clock halved: 59.18MHz over a
  # 2112x934 total gives 30.0Hz exactly. Naming the mode here means it exists
  # regardless of the driver's built-in list, and 30Hz still lifts the 20Hz cap
  # the 1920x1080_20.00 mode imposed - the server produced 20 frames a second no
  # matter how fast the client was - at half the scan and encode cost of 60Hz.
  Modeline "1600x900_30.00" 59.18 1600 1696 1856 2112 900 903 908 934 -HSync +Vsync
  Option "PreferredMode" "1600x900_30.00"
EndSection

Section "Screen"
  Identifier "dummy_screen"
  Device "dummy_videocard"
  Monitor "dummy_monitor"
  DefaultDepth 24
  SubSection "Display"
    Viewport 0 0
    Depth 24
    Modes "1600x900_30.00" "1920x1080_20.00" 
  EndSubSection
EndSection

Section "ServerLayout"
  Identifier   "dummy_layout"
  Screen       "dummy_screen"
  InputDevice  "dummy_mouse"
  InputDevice  "dummy_keyboard"
    Option "AutoAddDevices" "false"
EndSection

Section "Module"
	Disable "vmmouse"
EndSection

